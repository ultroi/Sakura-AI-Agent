user:
  name: Akshay
  github: ultroi

runtime:
  name: python
  version: 3.11
  # using python 3.11 slim image
  image: python:3.11-slim

commands:
  # no system packages are requested; StackHost free tier allows none by default
  package: ""
  build:
    - pip install -r requirements.txt
    - python -m py_compile app.py
  start: "python app.py"

repository:
  branch: main
  auto_deploy: True

env:
  - BOT_TOKEN:YOUR_TELEGRAM_BOT_TOKEN